[package]
name = "study-tracker-native-prototype"
version = "0.1.0"
edition = "2021"
rust-version = "1.77.2"
build = "build.rs"
publish = false

[workspace]
members = ["crates/study-tracker-core"]
resolver = "2"

[dependencies]
study-tracker-core = { path = "crates/study-tracker-core" }
slint = { version = "1.17.1", default-features = false, features = ["compat-1-2", "std", "accessibility", "backend-winit", "renderer-femtovg"] }
# Platform-path resolution (Stage 13 shell). Small, no async runtime, no transitive bloat; chosen
# over hand-rolled %LOCALAPPDATA% lookups so path logic is auditable in one place. Not used by
# study-tracker-core.
dirs = "6"
# Logging facade. Already resolved transitively via slint -> i-slint-core, added here directly
# only to call the macros; adds no new crate to the dependency tree.
log = "0.4"
# Timestamp formatting for the log file. Already resolved transitively via slint -> i-slint-core
# (its date/time widgets); reused here for the same reason, adds no new crate.
chrono = { version = "0.4", default-features = false, features = ["clock"] }
# Native storage format and production-backup parsing (Stage 15, docs/stage15-persistence-migration.md).
# study-tracker-core already derives Serialize/Deserialize (serde) on every DTO that crosses the
# persistence boundary; serde_json is the plain, minimal JSON reader/writer for that boundary, not
# a database/ORM/async runtime - the one new direct dependency this stage adds. Confined to this
# bin crate; study-tracker-core stays free of it (and of all filesystem/serialization-format code).
serde_json = "1"
# Already resolved transitively (study-tracker-core depends on it directly, and slint pulls it in
# too); added here directly only to use its `Deserialize` derive on the production-backup import
# shape (persistence/migration.rs), adding no new crate to the dependency tree.
serde = { version = "1", features = ["derive"] }
# Stage 18 updater: Ed25519/minisign signature verification, the format Tauri's updater uses
# (production's `plugins.updater.pubkey`). Zero dependencies of its own, ~600 lines, written by the
# minisign author; the one new crate of this stage.
minisign-verify = "0.2"

[target.'cfg(windows)'.dependencies]
# MessageBoxW fallback for fatal startup errors once the release build has no console (Stage 13,
# see src/platform/startup_error.rs). windows-sys is a thin FFI-declarations crate (no codegen
# beyond what's referenced) and is already resolved multiple times transitively by winit/glutin.
windows-sys = { version = "0.59", features = [
    "Win32_UI_WindowsAndMessaging",
    "Win32_Foundation",
    # Stage 18 platform layer: tray (Shell_NotifyIcon), single-instance (named mutex), tray icon
    # bitmaps (GDI), thread/module queries for window lookup.
    "Win32_UI_Shell",
    "Win32_System_Threading",
    "Win32_System_LibraryLoader",
    "Win32_Graphics_Gdi",
    "Win32_System_Registry",
    "Win32_Security",
    "Win32_Networking_WinHttp",
] }

# Toast notifications (Stage 18, src/platform/win_toast.rs): WinRT `ToastNotificationManager`. The
# `windows` crate is ALREADY in the dependency tree (slint -> winit -> accesskit_windows); this adds
# only three feature flags on the copy that is resolved anyway, no new crate.
windows = { version = "0.62", features = ["UI_Notifications", "Data_Xml_Dom", "Foundation"] }

[build-dependencies]
slint-build = "1.17.1"

[target.'cfg(windows)'.build-dependencies]
# Embeds the application icon and version/identity resource (assets/branding/app.rc) into the
# Windows executable (Stage 13). No-op build dependency on other platforms; kept target-gated so
# Linux/macOS builds never pull it in.
embed-resource = "3"
